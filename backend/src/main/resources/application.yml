server:
  port: 8080
  # The browser reaches this service through the Next.js proxy on :3000, so the
  # Host it sees is not the Host the user typed. Honouring X-Forwarded-* keeps
  # generated URLs pointing at :3000 where the session cookie lives.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # Lax, not None: the session cookie is never needed on a cross-site
        # request, and Lax is what stops another origin POSTing as the employee.
        # It is also why CSRF tokens are not wired through every fetch yet — see
        # SecurityConfig.
        same-site: lax
        # Set to true behind TLS. Left false so sign-in works over plain http on
        # localhost; a secure cookie is simply not sent there, which looks like a
        # login loop rather than an error.
        secure: false

spring:
  application:
    name: hr-knowledge-backend
  # The Atlas connection string carries a password, so it lives in
  # `application-local.yml` (gitignored) rather than here. `optional:` keeps the
  # service bootable without it — Mongo just fails on first use, and the rest of
  # the knowledge base still works.
  config:
    import: optional:file:./application-local.yml
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017}
      database: ${MONGODB_DB:hr_cockpit}
      # `messageId` on feedback and `owner` on threads are looked up on every
      # write; let Spring create those indexes from the @Indexed annotations.
      auto-index-creation: true
  servlet:
    multipart:
      # Per-file cap is enforced in the controller so one oversized file in a
      # batch reports a readable error instead of failing the whole request.
      max-file-size: 12MB
      max-request-size: 120MB
  jackson:
    # `hint`, `model` and `warning` are optional on the TypeScript side, and the
    # admin console tests them for truthiness — emitting them as null is fine and
    # keeps the payload shape stable.
    default-property-inclusion: always
  security:
    oauth2:
      client:
        registration:
          # The registration id is "azure-ad" because it is the last path segment
          # of the callback URI, and that is how Spring matches a callback back to
          # its registration. The URI itself is the NextAuth convention
          # (/api/auth/callback/<provider>) and is what the Entra app registration
          # already lists — Spring's own default would have been
          # /login/oauth2/code/<id>, which is not registered.
          azure-ad:
            client-name: Microsoft
            # client-id / client-secret / the tenant live in application-local.yml
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            # Absolute, not "{baseUrl}/...": Spring would resolve {baseUrl} to this
            # service's own :8080, but the browser is on :3000 and that is what is
            # registered. This exact string must appear as a Web redirect URI.
            # Being under /api also means the existing Next proxy already forwards
            # it — no extra rewrite needed.
            redirect-uri: ${APP_BASE_URL:http://localhost:3000}/api/auth/callback/azure-ad
        provider:
          azure-ad:
            # issuer-uri (the tenant) lives in application-local.yml.
            #
            # `sub`, not `preferred_username`, and this is a trap worth naming:
            # Spring validates this attribute against the *userinfo response*, and
            # Entra's userinfo returns only sub / name / given_name / family_name.
            # preferred_username is in the ID TOKEN, a different payload — asking
            # for it here fails the whole sign-in with "Attribute value for
            # 'preferred_username' cannot be null" after a successful code
            # exchange, which looks like a broken app rather than a config typo.
            #
            # `sub` is always present in userinfo. The UPN is still what the app
            # keys on: EntraOidcUserService reads preferred_username off the merged
            # ID-token claims and uses it for the principal name.
            user-name-attribute: sub

hr:
  auth:
    # When false, every /api endpoint is open and the demo login still works.
    # Flips to true automatically once a client-id is configured — see
    # AuthProperties, which is what stops a misconfiguration from silently
    # leaving the API unauthenticated.
    enabled: ${AUTH_ENABLED:true}
    # Fail startup instead of running open when sign-in is unusable.
    #
    # Default false so a fresh checkout with no credentials still boots. SET THIS TRUE IN
    # EVERY DEPLOYED PROFILE, and certainly in any deployment holding the employee extract:
    # the branch it guards serves every endpoint — including compensation, leave and
    # performance data — with no authentication at all. It used to log a warning and carry
    # on, which is how an open deployment reaches production. Now it refuses to start.
    require: ${AUTH_REQUIRED:false}
    # Who sees the admin dashboard. An Entra app role named HR.Admin (or a
    # `roles` claim containing hr_admin) wins over this list; the list exists so
    # the console is usable before app roles are set up in the portal.
    admin-emails: ${ADMIN_EMAILS:}
    # Where to send the browser after a successful sign-in.
    success-path: /chat

knowledge:
  # Ollama is now an EMBEDDING service only. Answer writing moved to the Claude API
  # below; what could not move is the embedder, because the Qdrant collections are
  # built from nomic-embed-text and Anthropic has no embeddings endpoint. A query
  # embedded by a different model lands in a different vector space, so retrieval
  # would not error — it would return the wrong passages. Keeping the existing index
  # means keeping this daemon.
  #
  # No chat model needs to be pulled any more: `ollama pull nomic-embed-text` is the
  # whole local requirement, and the 3.4 GB of qwen3.5:4b weights can be removed with
  # `ollama rm qwen3.5:4b`.
  ollama:
    url: ${OLLAMA_URL:http://127.0.0.1:11434}
    # Changing this invalidates every vector in Qdrant. A different width fails loudly
    # (Qdrant rejects the search); a same-width different model fails silently, which
    # is worse. Either way it means a reindex, not a restart.
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    # How long Ollama holds the weights after a call. Its own default is 5 minutes,
    # which quietly makes the first question after any lull the slow one: the model
    # is evicted and re-read from disk before the query can be embedded.
    #
    # Much cheaper to honour than it used to be — this now keeps ~0.3 GB resident
    # rather than that plus 3.4 GB of chat weights, so the RAM argument for lowering
    # it has largely gone away. `-1` never evicts.
    keep-alive: ${OLLAMA_KEEP_ALIVE:30m}

  # The Claude API — answer writing.
  claude:
    # Never commit this. Put it in application-local.yml (gitignored, already
    # imported above) or export ANTHROPIC_API_KEY. Blank is a supported state: the
    # assistant falls back to extractive answers, exactly as it did when no chat
    # model was pulled.
    api-key: ${ANTHROPIC_API_KEY:}
    # claude-haiku-4-5, because latency and cost were chosen over answer quality: it is
    # the fastest current model and a fifth of Opus 5's price ($1/$5 per MTok against
    # $5/$25), and this task — restate five retrieved passages in a few sentences, or
    # decline — is well within it.
    #
    # Most of the speed is not the model being small, it is that Haiku 4.5 does not
    # think by default. On Opus 5 thinking is on unless disabled, and it was costing
    # ~4.6s before the first visible token; here there is no such phase.
    #
    # Two things this model gives up, both of which the code handles rather than
    # breaks on:
    #   - `effort` does not exist on it and returns a 400. Not sent — see
    #     ClaudeClient.supportsEffort.
    #   - The minimum cacheable prefix is 4096 tokens, against 512 on Opus 5. This
    #     system prompt is ~1.2k, so prompt caching silently stops applying: no error,
    #     just `cache=read 0` in the generate log. Cheaper per token anyway, but it
    #     means the caching knob below is inert on this model.
    #
    # claude-opus-5 is the switch back if the grounding cases start failing. The two
    # hard ones (answering the *nearest* question rather than the one asked, and copying
    # passages verbatim) are what a smaller model fails first — re-run them from
    # docs/AI-SETUP.md rather than assuming this model holds the contract.
    model: ${CLAUDE_MODEL:claude-haiku-4-5}
    # Ceiling on ONE response, covering thinking and the visible answer together.
    #
    # Deliberately not the 250 the local model was given. On a thinking model the
    # thinking is billed and counted inside this budget, so a ceiling sized to the
    # answer alone truncates it mid-sentence — the failure looks like a broken answer,
    # not like a config problem. The headroom stays even though the default model does
    # not think, so that switching back to Opus 5 does not need this raised again.
    # Nothing is charged for headroom; the bill is what the model actually produces.
    max-answer-tokens: ${CLAUDE_MAX_ANSWER_TOKENS:2000}
    # low | medium | high | xhigh | max — how hard the model works, and the main
    # latency lever on the models that support one.
    #
    # Ignored on the default model: Haiku 4.5 has no effort parameter, so this value is
    # not sent (the admin console shows the effort as "—" rather than claiming one that
    # is not applied). It applies again the moment the model is switched back to Opus 5.
    #
    # `low` because the task is bounded and the passages are already selected: the
    # model is not solving anything, it is restating retrieved text under a strict
    # grounding contract. Raise it if the grounding cases start failing — a model
    # answering the nearest question rather than the one asked is the symptom that
    # more effort actually fixes.
    #
    # NOT named CLAUDE_EFFORT. Claude Code injects a CLAUDE_EFFORT variable into its own
    # session environment, so a backend launched from inside one silently ran at `high`
    # instead of `low` — the misconfiguration this whole latency problem started as.
    effort: ${KNOWLEDGE_CLAUDE_EFFORT:low}
    # The system prompt is byte-identical on every turn and sits ahead of everything
    # volatile, which makes it exactly the prefix worth caching: after the first call
    # in a 5-minute window it bills at roughly a tenth of input price instead of full.
    # Watch `cache=read N` in the generate log — a read count stuck at 0 across
    # back-to-back questions means something upstream is varying the prefix.
    cache-system-prompt: ${CLAUDE_CACHE_SYSTEM_PROMPT:true}
  # Reading text out of images inside uploads — a scanned circular, a screenshot of an
  # entitlements table, a policy pasted in as a picture. Without this, a .docx or PDF
  # whose content is an image indexes as nothing and the assistant answers "not in the
  # documents" about a policy HR is certain it uploaded.
  #
  # Runs on the Claude vision API, not a local OCR engine: Tesseract is free per image
  # but puts back the local-model dependency this service just removed (a native binary
  # plus language data on every machine), and it is tuned for clean scanned prose rather
  # than the screenshots and diagrams that actually turn up in HR documents.
  ocr:
    enabled: ${OCR_ENABLED:true}
    # Deliberately NOT knowledge.claude.model. Answering is a per-question cost and wants
    # the cheapest adequate model; this is a per-upload cost where accuracy matters more,
    # and the two should be free to differ.
    #
    # Worth knowing before lowering it: claude-haiku-4-5 downsamples images to 1568px on
    # the long edge, against 2576px on claude-opus-5 and claude-sonnet-5. On a dense
    # scanned page that is the difference between small print being read and being
    # guessed at. Haiku is the default because most images here are screenshots rather
    # than dense scans; switch to claude-opus-5 if scans read badly.
    model: ${OCR_MODEL:claude-haiku-4-5}
    # Hard cap per upload. A 200-slide deck saved as .docx would otherwise be 200 vision
    # calls inside one HTTP request. Images past the cap are reported as skipped, not
    # silently dropped.
    max-images-per-document: ${OCR_MAX_IMAGES:12}
    # Images below this are skipped unread. Logos, bullet glyphs and signature squiggles
    # are the bulk of images in a policy document and none carry text worth indexing;
    # paying a vision call to discover that on every upload is waste.
    min-image-bytes: ${OCR_MIN_IMAGE_BYTES:6144}
    # Ceiling on one transcription. A dense A4 page is roughly 700-900 tokens of text.
    max-answer-tokens: ${OCR_MAX_ANSWER_TOKENS:1500}
  # The static HR extract — four .xlsx workbooks from HR Ops, loaded by an admin from the
  # console. Not read at startup: importing replaces the whole employee collection, and that
  # is not something a restart should do on its own.
  employee-import:
    directory: ${HR_EXTRACT_DIR:}
    # The extract writes @lsq.com; Entra identities are @leadsquared.com. Without this rewrite
    # the lookup keyed on the session email matches nothing and every employee is told they
    # have no record — a total failure that looks exactly like an empty database.
    from-domain: ${HR_EXTRACT_FROM_DOMAIN:lsq.com}
    to-domain: ${HR_EXTRACT_TO_DOMAIN:leadsquared.com}
    # Signed-in email -> employee code, for testing only. Deliberately EMPTY here.
    #
    # An entry makes one account resolve to another person's record, which is exactly what the
    # privacy rules forbid — so it does not belong in committed configuration where it would
    # ship to every deployment. Put it in application-local.yml (gitignored) instead:
    #
    #   knowledge:
    #     employee-import:
    #       identity-overrides:
    #         "[someone@example.com]": LS00008
    #
    # Bracket quoting is required, or Spring reads the dots in the address as nested properties.
    identity-overrides: {}
  qdrant:
    url: ${QDRANT_URL:http://127.0.0.1:6333}
    api-key: ${QDRANT_API_KEY:}
    chunk-collection: hr_chunks
    doc-collection: hr_docs
    vector-size: 768
  migration:
    # One-time import of the Node implementation's store. Skipped automatically
    # once the Qdrant collections hold anything.
    legacy-store: ${LEGACY_STORE:../data/knowledge.json}
    enabled: true

logging:
  level:
    com.leadsquared.hr.knowledge: INFO
